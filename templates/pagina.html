<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuovo preventivo</title>
  <link rel="icon" href="data:,">
  <style>
    /* L'aspetto della pagina. Le misure sono pensate prima per il telefono:
       caselle larghe quanto lo schermo e scritte grandi, facili da toccare. */
    :root { --blu: #1f3a5f; --grigio: #5b6470; --bordo: #cfd6de; --sfondo: #f4f6f8; --rosso: #b42318; --giallo: #fff4ce; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--sfondo); color: #1a1f26; font: 17px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 16px 16px 120px; }
    h1 { font-size: 24px; margin: 8px 0 4px; color: var(--blu); }
    .aiuto { color: var(--grigio); font-size: 15px; margin: 0 0 16px; }
    .scheda { background: #fff; border: 1px solid var(--bordo); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .scheda h2 { font-size: 17px; margin: 0 0 10px; color: var(--blu); display: flex; justify-content: space-between; align-items: center; }
    label { display: block; font-size: 14px; font-weight: 600; color: var(--grigio); margin: 12px 0 4px; }
    label:first-child { margin-top: 0; }
    input, select, textarea { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--bordo); border-radius: 8px; background: #fff; color: inherit; }
    textarea { min-height: 84px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--blu); outline-offset: 1px; }
    .due { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .quantita-unita { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }   /* La quantità è un numero corto: l'unità prende due terzi, così "mq (metri quadrati)" si legge intero */
    .nascosto { display: none; }
    .dettaglio { font-size: 15px; color: var(--grigio); margin: 10px 0 0; min-height: 1.4em; }
    .attenzione { background: var(--giallo); color: #5c4400; border-radius: 8px; padding: 10px 12px; margin: 8px 0 0; font-size: 15px; }   /* L'avviso sotto una voce: non blocca, chiede solo di ricontrollare */
    button { font: inherit; font-weight: 600; border-radius: 8px; padding: 12px 16px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }        /* Mentre il documento si sta creando il pulsante resta spento: un secondo tocco non crea un secondo file */
    .secondario { background: #fff; color: var(--blu); border: 1px solid var(--blu); width: 100%; }
    .togli { background: none; border: none; color: var(--rosso); padding: 4px 0; font-size: 14px; }
    .principale { background: var(--blu); color: #fff; border: 1px solid var(--blu); }
    .avviso { border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; font-size: 15px; }
    .avviso ul { margin: 6px 0 0; padding-left: 20px; }
    .errori { background: #fde8e6; color: var(--rosso); }
    .mancanze { background: var(--giallo); color: #5c4400; }
    .fatto { background: #e3f4e5; color: #1d5a27; }
    /* Il riquadro sotto una descrizione corretta: mostra il testo di prima, per confrontarlo. */
    .prima { background: var(--giallo); color: #5c4400; border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 15px; }
    .prima strong { display: block; font-size: 13px; }
    .rimetti { background: none; border: none; color: var(--blu); padding: 6px 0 0; font-size: 14px; text-decoration: underline; }
    #sistema { margin-top: 10px; }
    #sistema + .aiuto { margin-top: 8px; }
    /* La barra in fondo resta sempre visibile mentre si scorre: mostra il totale e il pulsante. */
    .barra { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--bordo); }
    .barra div { max-width: 720px; margin: 0 auto; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .totale { font-size: 14px; color: var(--grigio); }
    .totale strong { display: block; font-size: 20px; color: #1a1f26; }
  </style>
</head>
<body>
<main>
  <h1>Nuovo preventivo</h1>
  <p class="aiuto">Compila le caselle dall'alto in basso. Puoi scrivere oppure dettare con il microfono della tastiera.</p>

  <div id="messaggi"></div>

  <section class="scheda">
    <label for="cliente">Spettabile</label>
    <input id="cliente" autocomplete="off" placeholder="Nome del cliente, scritto come deve comparire">

    <div class="due">
      <div>
        <label for="data">Data</label>
        <input id="data" type="date" value="{{ oggi }}">
      </div>
      <div>
        <label for="tipo">Documento</label>
        <select id="tipo">
          <option value="preventivo">Preventivo</option>
          <option value="consuntivo">Consuntivo</option>
        </select>
      </div>
    </div>

    <label for="indirizzo">Luogo</label>
    <input id="indirizzo" autocomplete="off" placeholder="es. via ponte 33 robecco sul naviglio milano">

    <label for="titolo">Lavoro</label>
    <input id="titolo" autocomplete="off" placeholder="es. sostituzione vasca in doccia">
  </section>

  <div id="voci"></div>

  <button type="button" class="secondario" id="aggiungi">+ Aggiungi voce</button>
  <button type="button" class="secondario" id="sistema">Sistema il testo delle descrizioni</button>
  <p class="aiuto">Corregge gli errori di italiano senza cambiare quello che hai scritto. Nomi, luoghi e prezzi non vengono toccati.</p>
  <p class="aiuto"><a href="/esci">Esci</a> (per rientrare servirà la password)</p>
</main>

<div class="barra">
  <div>
    <span class="totale">Totale<strong id="totale">€ 0,00 + IVA</strong></span>
    <button type="button" class="principale" id="crea">Crea il preventivo</button>
  </div>
</div>

<!-- Il modello di una voce. Non si vede: viene copiato ogni volta che si preme "Aggiungi voce". -->
<template id="modello-voce">
  <section class="scheda voce">
    <h2><span class="numero">Voce</span><button type="button" class="togli">Togli</button></h2>

    <label>Descrizione</label>
    <textarea class="descrizione" placeholder="Cosa viene fatto"></textarea>
    <!-- Compare solo dopo "Sistema il testo", se la descrizione è stata corretta: fa vedere com'era prima -->
    <div class="prima nascosto">
      <strong>Prima era:</strong>
      <span class="testo-prima"></span>
      <button type="button" class="rimetti">Rimetti il mio testo</button>
    </div>

    <label>Misura</label>
    <select class="misura">
      <option value="corpo">A corpo</option>
      <option value="misura">A misura (mq, mt, pezzi...)</option>
    </select>

    <div class="due quantita-unita solo-misura nascosto">
      <div>
        <label>Quantità</label>
        <input class="quantita" inputmode="decimal" autocomplete="off" placeholder="es. 25">
      </div>
      <div>
        <label>Unità</label>
        <!-- value è quello che finisce nel Word (corto), il testo dopo è quello che si legge nel menu -->
        <select class="unita">
          <option value="">Scegli...</option>
          <option value="mq">mq (metri quadrati)</option>
          <option value="mt">mt (metri)</option>
          <option value="ml">ml (metri lineari)</option>
          <option value="mc">mc (metri cubi)</option>
          <option value="pz">pz (pezzi)</option>
          <option value="ore">ore</option>
          <option value="altra">Altra unità...</option>
        </select>
      </div>
    </div>

    <!-- Compare solo se nel menu si sceglie "Altra unità...": qui si può scrivere o dettare -->
    <div class="solo-altra nascosto">
      <label>Quale unità?</label>
      <input class="altra-unita" autocomplete="off" placeholder="es. kg">
    </div>

    <div class="due">
      <div>
        <label>Prezzo</label>
        <input class="prezzo" inputmode="decimal" autocomplete="off" placeholder="es. 593">
      </div>
      <div class="solo-misura nascosto">
        <label>Il prezzo è</label>
        <select class="tipo-prezzo">
          <option value="totale">il totale</option>
          <option value="unitario">per unità</option>
        </select>
      </div>
    </div>

    <p class="dettaglio"></p>
    <p class="attenzione nascosto"></p>
  </section>
</template>

<script>
  // Questa parte è scritta in JavaScript, il linguaggio che gira dentro il browser.
  // Fa solo tre cose: aggiunge e toglie le voci, manda a Python quello che è scritto
  // nelle caselle, e mostra quello che Python risponde. Nessun calcolo viene fatto qui.

  const voci = document.getElementById("voci");            // Il contenitore di tutte le voci
  const messaggi = document.getElementById("messaggi");    // Dove compaiono errori e avvisi

  // Copia il modello di una voce e lo aggiunge in fondo.
  function aggiungiVoce() {
    const copia = document.getElementById("modello-voce").content.cloneNode(true);
    voci.appendChild(copia);
    rinumera();
  }

  // Riscrive "Voce 1", "Voce 2"... dopo che se ne aggiunge o toglie una.
  function rinumera() {
    voci.querySelectorAll(".voce").forEach((voce, posizione) => {
      voce.querySelector(".numero").textContent = "Voce " + (posizione + 1);
    });
  }

  // Mostra quantità, unità e tipo di prezzo solo quando la voce è a misura.
  function mostraCampiMisura(voce) {
    const aMisura = voce.querySelector(".misura").value === "misura";
    voce.querySelectorAll(".solo-misura").forEach(pezzo => pezzo.classList.toggle("nascosto", !aMisura));
    const altra = aMisura && voce.querySelector(".unita").value === "altra";            // La casella "Quale unità?" serve solo con "Altra unità..."
    voce.querySelector(".solo-altra").classList.toggle("nascosto", !altra);
  }

  // L'unità della voce: quella scelta nel menu, oppure quella scritta a mano se si è scelto "Altra unità...".
  // Restituisce per esempio "mq", "kg", oppure "" se non è stata scelta.
  function unitaScelta(voce) {
    const menu = voce.querySelector(".unita").value;
    return menu === "altra" ? voce.querySelector(".altra-unita").value : menu;
  }

  // Raccoglie quello che è scritto in tutte le caselle, nella forma che si aspetta app.py.
  function leggiModulo() {
    const testo = id => document.getElementById(id).value;
    return {
      tipo: testo("tipo"), cliente: testo("cliente"), data: testo("data"),
      indirizzo: testo("indirizzo"), titolo: testo("titolo"),
      voci: [...voci.querySelectorAll(".voce")].map(voce => ({
        descrizione: voce.querySelector(".descrizione").value,
        misura: voce.querySelector(".misura").value,
        quantita: voce.querySelector(".quantita").value,
        unita: unitaScelta(voce),
        prezzo: voce.querySelector(".prezzo").value,
        tipo_prezzo: voce.querySelector(".tipo-prezzo").value,
      })),
    };
  }

  // Manda il modulo a Python e restituisce la risposta.
  // Se il programma è spento, o risponde in un modo che non si capisce, restituisce dati: null invece di rompersi in silenzio.
  const NON_RAGGIUNGIBILE = "Non riesco a collegarmi al programma. Controlla che sia acceso e riprova.";
  async function chiedi(indirizzo) {
    try {
      const risposta = await fetch(indirizzo, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(leggiModulo()),
      });
      if (risposta.status === 401) return { ok: false, dati: null, scaduta: true };     // Sono passati più di 30 giorni dall'ultima volta: serve di nuovo la password
      return { ok: risposta.ok, dati: await risposta.json() };
    } catch (errore) {
      return { ok: false, dati: null };
    }
  }

  // L'avviso per quando la password va riscritta. La pagina per entrare si apre in un'altra scheda,
  // così quello che è già stato scritto qui non va perso.
  function avvisoSessioneScaduta() {
    const div = riquadro("errori", "Devi rientrare con la password. ", []);
    const collegamento = document.createElement("a");
    collegamento.href = "/accesso"; collegamento.target = "_blank"; collegamento.textContent = "Tocca qui per rientrare";
    div.append(collegamento, ", poi torna su questa scheda e riprova: quello che hai scritto è ancora qui.");
    return div;
  }

  // Scrive un riquadro colorato con un titolo e un elenco di frasi.
  function riquadro(tipo, titolo, frasi) {
    const div = document.createElement("div");
    div.className = "avviso " + tipo;
    div.append(titolo);
    if (frasi.length) {
      const elenco = document.createElement("ul");
      frasi.forEach(frase => { const riga = document.createElement("li"); riga.textContent = frase; elenco.appendChild(riga); });
      div.appendChild(elenco);
    }
    return div;
  }

  // Una voce conta come "compilata" se c'è scritto qualcosa nelle caselle che si vedono.
  // Quantità e unità sono nascoste nelle voci a corpo: se lì è rimasto qualcosa, non va contato (lo stesso fa app.py).
  function vociCompilate() {
    return [...voci.querySelectorAll(".voce")].filter(voce => {
      const aMisura = voce.querySelector(".misura").value === "misura";
      const caselle = aMisura ? [".descrizione", ".quantita", ".prezzo"] : [".descrizione", ".prezzo"];
      return caselle.some(nome => voce.querySelector(nome).value.trim() !== "") || (aMisura && unitaScelta(voce).trim() !== "");
    });
  }

  // Chiede a Python totali e testi sistemati, e li mostra.
  // "casella" è la casella appena lasciata: solo quella viene riscritta, per non disturbare mentre si scrive altrove.
  let ultimaRichiesta = 0;      // Numera le richieste: se ne parte una nuova mentre la vecchia non è tornata, conta solo la nuova
  async function aggiorna(casella) {
    const mia = ++ultimaRichiesta;
    const compilate = vociCompilate();                  // Le voci compilate nel momento in cui parte la richiesta: le risposte di Python si abbinano a queste
    const inviato = casella ? casella.value : null;     // Cosa c'era scritto nella casella quando è partita la richiesta
    const { dati, scaduta } = await chiedi("/anteprima");
    if (scaduta) { messaggi.replaceChildren(avvisoSessioneScaduta()); return; }
    if (!dati) { messaggi.replaceChildren(riquadro("errori", NON_RAGGIUNGIBILE, [])); return; }

    // Una casella si riscrive solo se nel frattempo non è stata modificata di nuovo: altrimenti si cancellerebbe quello che si sta scrivendo.
    const invariata = !casella || casella.value === inviato;
    if (casella && casella.id === "indirizzo" && invariata) casella.value = dati.indirizzo;     // "via ponte 33 robecco milano" -> "Via Ponte 33, Robecco, MI"
    compilate.forEach((voce, posizione) => {
      const riga = dati.voci[posizione];
      if (!riga || !invariata) return;
      const prezzo = voce.querySelector(".prezzo");
      if (casella === prezzo && riga.prezzo) prezzo.value = riga.prezzo;                        // "593€" -> "€ 593,00"
      const altra = voce.querySelector(".altra-unita");
      if (casella === altra && riga.unita) {                                                    // "Metri Quadrati" -> "mq"
        const menu = voce.querySelector(".unita");
        if ([...menu.options].some(opzione => opzione.value === riga.unita)) { menu.value = riga.unita; altra.value = ""; mostraCampiMisura(voce); }   // Se è un'unità del menu, torna lì
        else altra.value = riga.unita;
      }
    });

    if (mia !== ultimaRichiesta) return;                // C'è già una richiesta più recente: totale, righe e avvisi li scrive quella
    document.getElementById("totale").textContent = dati.totale;
    voci.querySelectorAll(".dettaglio").forEach(riga => riga.textContent = "");   // Le righe vuote Python le salta: si abbinano le risposte alle sole voci compilate
    voci.querySelectorAll(".attenzione").forEach(riga => riga.classList.add("nascosto"));
    compilate.forEach((voce, posizione) => {
      const riga = dati.voci[posizione];
      if (!riga) return;
      voce.querySelector(".dettaglio").textContent = riga.dettaglio;
      const attenzione = voce.querySelector(".attenzione");                         // Es. "la quantità è 1250 mc, più di mille": compare solo se Python ha qualcosa da far notare
      attenzione.textContent = riga.attenzione;
      attenzione.classList.toggle("nascosto", !riga.attenzione);
    });

    // Gli errori si mostrano solo se riguardano qualcosa di scritto male: "non c'è nessuna voce" all'inizio sarebbe solo fastidioso.
    messaggi.replaceChildren();
    const scrittiMale = dati.errori.filter(frase => frase.startsWith("Voce"));
    if (scrittiMale.length) messaggi.appendChild(riquadro("errori", "Da correggere:", scrittiMale));
  }

  // Crea il Word. Se Python risponde con degli errori li mostra, altrimenti fa partire lo scaricamento.
  async function crea() {
    const pulsante = document.getElementById("crea");
    if (pulsante.disabled) return;
    pulsante.disabled = true;                           // Spento finché non arriva la risposta: un secondo tocco non crea un secondo file
    pulsante.textContent = "Sto creando...";
    try {
      const { ok, dati, scaduta } = await chiedi("/crea");
      messaggi.replaceChildren();
      if (scaduta) {
        messaggi.appendChild(avvisoSessioneScaduta());
      } else if (!dati) {
        messaggi.appendChild(riquadro("errori", NON_RAGGIUNGIBILE, []));
      } else if (!ok) {
        messaggi.appendChild(riquadro("errori", "Il preventivo non è stato creato. Da correggere:", dati.errori));
      } else {
        if (dati.bozza) messaggi.appendChild(riquadro("mancanze", "Creato come BOZZA. Mancano ancora:", dati.mancanze));
        else messaggi.appendChild(riquadro("fatto", "Preventivo creato: " + dati.file + " (" + dati.totale + ")", []));
        if (dati.avvisi.length) messaggi.appendChild(riquadro("mancanze", "Attenzione:", dati.avvisi));
        window.location = "/scarica";                     // Quale file mandare lo sa Python: il nome non passa dall'indirizzo
      }
    } finally {
      pulsante.disabled = false;                        // "finally" gira sempre, anche se qualcosa va storto: il pulsante non resta bloccato
      pulsante.textContent = "Crea il preventivo";
    }
    window.scrollTo({ top: 0, behavior: "smooth" });    // Torna in cima, dove sta il messaggio
  }

  // Corregge l'italiano delle descrizioni. A Python (e da lì a Gemini) vanno solo i testi delle descrizioni:
  // niente cliente, luogo o prezzi. Ogni descrizione cambiata mostra sotto il testo di prima, per poter tornare indietro.
  async function sistema() {
    const pulsante = document.getElementById("sistema");
    if (pulsante.disabled) return;
    const caselle = [...voci.querySelectorAll(".descrizione")];
    const inviate = caselle.map(casella => casella.value);          // I testi come sono adesso, es. ["posa piato docia", ""]
    if (!inviate.some(testo => testo.trim() !== "")) {
      messaggi.replaceChildren(riquadro("mancanze", "Non c'è ancora nessuna descrizione da sistemare.", []));
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    pulsante.disabled = true;
    pulsante.textContent = "Sto sistemando...";
    let dati = null, scaduta = false;
    try {
      const risposta = await fetch("/sistema", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ descrizioni: inviate }),
      });
      scaduta = risposta.status === 401;
      dati = await risposta.json();
    } catch (errore) {
      dati = null;                                                  // Programma spento o risposta illeggibile
    } finally {
      pulsante.disabled = false;
      pulsante.textContent = "Sistema il testo delle descrizioni";
    }

    messaggi.replaceChildren();
    if (scaduta) {
      messaggi.appendChild(avvisoSessioneScaduta());
    } else if (!dati) {
      messaggi.appendChild(riquadro("errori", NON_RAGGIUNGIBILE, []));
    } else if (dati.errore) {
      messaggi.appendChild(riquadro("errori", dati.errore, []));    // Es. manca la chiave, niente internet, limite superato
    } else {
      let cambiate = 0;
      const scartate = [];                                          // I numeri delle voci lasciate com'erano, es. [3, 7]
      dati.descrizioni.forEach((corretta, posizione) => {
        const casella = caselle[posizione];
        if (corretta.scartata) scartate.push(posizione + 1);
        // Si riscrive solo se la correzione c'è e se nel frattempo la casella non è stata toccata o tolta.
        if (!corretta.cambiata || !casella.isConnected || casella.value !== inviate[posizione]) return;
        const voce = casella.closest(".voce");
        const prima = voce.querySelector(".prima");
        if (prima.classList.contains("nascosto")) voce.querySelector(".testo-prima").textContent = inviate[posizione];   // Se il riquadro c'è già, resta il primissimo testo
        prima.classList.remove("nascosto");
        casella.value = corretta.testo;
        cambiate++;
      });
      const frasi = [];
      if (scartate.length) frasi.push((scartate.length === 1 ? "La voce " + scartate[0] + " è rimasta com'era" : "Le voci " + scartate.join(", ") + " sono rimaste com'erano") + ": la correzione proposta cambiava troppo il testo." + (scartate.length === 1 ? " Controllala tu." : " Controllale tu."));
      if (cambiate) {
        frasi.unshift("Rileggile: sotto ognuna c'è il testo di prima. Se preferisci il tuo, premi \"Rimetti il mio testo\".");
        messaggi.appendChild(riquadro("fatto", cambiate === 1 ? "Ho sistemato 1 descrizione." : "Ho sistemato " + cambiate + " descrizioni.", frasi));
      } else {
        messaggi.appendChild(riquadro("fatto", "Non ho cambiato niente: le descrizioni vanno già bene così.", frasi));
      }
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // Cosa succede quando si tocca qualcosa.
  document.getElementById("aggiungi").addEventListener("click", aggiungiVoce);
  document.getElementById("crea").addEventListener("click", crea);
  document.getElementById("sistema").addEventListener("click", sistema);
  voci.addEventListener("click", evento => {
    if (evento.target.classList.contains("togli")) { evento.target.closest(".voce").remove(); rinumera(); aggiorna(); }
    if (evento.target.classList.contains("rimetti")) {              // Torna al testo scritto da lui e nasconde il riquadro
      const voce = evento.target.closest(".voce");
      voce.querySelector(".descrizione").value = voce.querySelector(".testo-prima").textContent;
      voce.querySelector(".prima").classList.add("nascosto");
    }
  });
  // "change" scatta quando si esce da una casella dopo averla modificata, o si cambia una scelta.
  // È il momento in cui la casella viene anche riscritta in bella copia ("593€" -> "€ 593,00").
  let attesa = null;            // Il timer dell'aggiornamento "mentre si scrive" (vedi sotto)
  document.addEventListener("change", evento => {
    clearTimeout(attesa);       // Sta già partendo un aggiornamento completo: quello in attesa non serve più
    const voce = evento.target.closest(".voce");
    if (voce) mostraCampiMisura(voce);
    aggiorna(evento.target);
  });
  // "input" scatta a ogni tasto premuto e a ogni parola dettata, senza aspettare che si esca dalla casella.
  // Serve per il totale: senza, cambiando un prezzo il totale restava quello vecchio finché non si toccava altrove.
  // Per non chiamare Python a ogni tasto si aspetta mezzo secondo di pausa: ogni nuovo tasto fa ripartire il timer.
  document.addEventListener("input", () => {
    clearTimeout(attesa);
    attesa = setTimeout(() => aggiorna(), 500);     // aggiorna() senza casella: ricalcola totale e righe ma non riscrive niente, per non disturbare chi sta scrivendo
  });

  aggiungiVoce();     // Si parte con una voce già pronta
</script>
</body>
</html>
